<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1664" width="1200" height="1664" role="img" aria-label="ZAPKIT — путь клиента"><title>ZAPKIT — путь клиента</title><rect width="1200" height="1664" fill="#FAF7F0"/><g transform="translate(60 50) scale(0.62)"><g transform="translate(0 -30) scale(1.5)"><defs><clipPath id="wb-pl"><path d="M8,60 C8,43 23,34 42,34 C57,34 67,41 71,51 C76,47 79,41 81.5,31 L86.5,31 C88,48 81,60 70,64 C66,76 54,84 38,84 C20,84 8,75 8,60 Z"/></clipPath></defs><path fill="#14161A" d="M8,60 C8,43 23,34 42,34 C57,34 67,41 71,51 C76,47 79,41 81.5,31 L86.5,31 C88,48 81,60 70,64 C66,76 54,84 38,84 C20,84 8,75 8,60 Z"/><path fill="#14161A" d="M84,36 C80,28 73,25 66,26 C70,19 79,19 84,27 C89,19 98,19 102,26 C95,25 88,28 84,36 Z"/><g clip-path="url(#wb-pl)" fill="#FFC72C"><rect x="40" y="30" width="8" height="60"/><rect x="0" y="64" width="90" height="7"/></g><circle cx="22" cy="55" r="3.6" fill="#FFC72C"/><path d="M28,28 V18 M28,22 C24,18 20,18 17,20 M28,22 C32,18 36,18 39,20" fill="none" stroke="#14161A" stroke-width="4.4" stroke-linecap="round"/></g><g transform="translate(176 0)"><defs><clipPath id="c66-pl"><rect width="66" height="100"/></clipPath><clipPath id="c18-pl"><rect width="18" height="100"/></clipPath></defs><g transform="translate(0 0)"><path clip-path="url(#c66-pl)" d="M0,9 H57 L9,91 H66" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g><g transform="translate(80 0)"><path clip-path="url(#c66-pl)" d="M9,100 V36 L28,9 H38 L57,36 V100 M9,62 H57" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g><g transform="translate(160 0)"><path clip-path="url(#c66-pl)" d="M9,100 V9 H44 A13,13 0 0 1 57,22 V45 A13,13 0 0 1 44,58 H9" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g><g transform="translate(240 0)"><path clip-path="url(#c66-pl)" d="M9,0 V100 M9,64 L62,-6 M30,44 L66,106" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g><g transform="translate(320 0)"><path clip-path="url(#c18-pl)" d="M9,0 V100" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g><g transform="translate(352 0)"><path clip-path="url(#c66-pl)" d="M0,9 H66 M33,9 V100" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g></g></g><text x="60" y="190" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#14161A" text-anchor="start">ПУТЬ КЛИЕНТА</text><text x="60" y="234" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#8C929B" text-anchor="start">от первого сообщения до заказа в работе</text><rect x="60" y="262" width="1080" height="64" rx="18" fill="none" stroke="#FFC72C" stroke-width="4"/><text x="84" y="303" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Купил сразу, без переписки → всё равно просим VIN и перепроверяем → шаг 3</text><line x1="124" y1="425.0" x2="124" y2="1457.0" stroke="#C9CDD3" stroke-width="6"/><rect x="60" y="350" width="1080" height="150" rx="24" fill="#FFFFFF"/><circle cx="124" cy="425.0" r="34" fill="#FFC72C"/><text x="124" y="437.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="middle">1</text><rect x="948.0" y="372" width="168.0" height="42" rx="21" fill="#14161A"/><text x="1032.0" y="400" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFC72C" text-anchor="middle">до 5 минут</text><text x="190" y="406" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="start">Клиент написал</text><text x="190" y="446" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Здороваемся и просим VIN (звонок — тоже)</text><text x="190" y="480" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8C929B" text-anchor="start">Работаем 9:00–20:00. В остальное время — автоответ, утром до 10:00</text><rect x="60" y="522" width="1080" height="150" rx="24" fill="#FFFFFF"/><circle cx="124" cy="597.0" r="34" fill="#FFC72C"/><text x="124" y="609.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="middle">2</text><rect x="842.4" y="544" width="273.6" height="42" rx="21" fill="#14161A"/><text x="979.2" y="572" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFC72C" text-anchor="middle">через 3 ч и завтра</text><text x="190" y="578" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="start">Ждём VIN</text><text x="190" y="618" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Напоминаем, если молчит — не больше 2 раз</text><text x="190" y="652" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8C929B" text-anchor="start">Нет ответа → «Отказ: не ответил»</text><rect x="60" y="694" width="1080" height="150" rx="24" fill="#FFFFFF"/><circle cx="124" cy="769.0" r="34" fill="#FFC72C"/><text x="124" y="781.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="middle">3</text><rect x="934.8" y="716" width="181.2" height="42" rx="21" fill="#14161A"/><text x="1025.4" y="744" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFC72C" text-anchor="middle">до 30 минут</text><text x="190" y="750" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="start">Подбор по VIN</text><text x="190" y="790" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Проверяем каждую деталь, наличие и срок у поставщика</text><text x="190" y="824" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8C929B" text-anchor="start">Чего-то нет → предлагаем замену</text><rect x="60" y="866" width="1080" height="150" rx="24" fill="#FFFFFF"/><circle cx="124" cy="941.0" r="34" fill="#FFC72C"/><text x="124" y="953.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="middle">4</text><rect x="842.4" y="888" width="273.6" height="42" rx="21" fill="#14161A"/><text x="979.2" y="916" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFC72C" text-anchor="middle">цена держится 24 ч</text><text x="190" y="922" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="start">Предложение</text><text x="190" y="962" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Состав с брендами, цена, дата отправки, как оплатить</text><text x="190" y="996" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8C929B" text-anchor="start">«Дорого» → другой бренд или без масла</text><rect x="60" y="1038" width="1080" height="150" rx="24" fill="#FFFFFF"/><circle cx="124" cy="1113.0" r="34" fill="#FFC72C"/><text x="124" y="1125.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="middle">5</text><rect x="816.0" y="1060" width="300.0" height="42" rx="21" fill="#14161A"/><text x="966.0" y="1088" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFC72C" text-anchor="middle">завтра и через 3 дня</text><text x="190" y="1094" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="start">Думает</text><text x="190" y="1134" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Два коротких напоминания, не больше</text><text x="190" y="1168" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8C929B" text-anchor="start">Молчит → «Отказ» с причиной</text><rect x="60" y="1210" width="1080" height="150" rx="24" fill="#FFFFFF"/><circle cx="124" cy="1285.0" r="34" fill="#FFC72C"/><text x="124" y="1297.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="middle">6</text><rect x="855.6" y="1232" width="260.4" height="42" rx="21" fill="#14161A"/><text x="985.8" y="1260" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFC72C" text-anchor="middle">проверяем в банке</text><text x="190" y="1266" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="start">Оплата</text><text x="190" y="1306" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Авито Доставка или перевод (СДЭК или самовывоз в Сочи)</text><text x="190" y="1340" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8C929B" text-anchor="start">Скриншот — не оплата. Деньги пришли → шаг 7</text><rect x="60" y="1382" width="1080" height="150" rx="24" fill="#14161A"/><circle cx="124" cy="1457.0" r="34" fill="#FFC72C"/><text x="124" y="1469.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="middle">7</text><rect x="842.4" y="1404" width="273.6" height="42" rx="21" fill="#FFC72C"/><text x="979.2" y="1432" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#14161A" text-anchor="middle">сразу после оплаты</text><text x="190" y="1438" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FAF7F0" text-anchor="start">В обработке</text><text x="190" y="1478" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#FAF7F0" text-anchor="start">Заказываем детали до отсечки, пишем дату отправки</text><text x="190" y="1512" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#C9CDD3" text-anchor="start">Дальше: сборка → фото коробки → СДЭК до 20:00 или самовывоз</text><text x="600.0" y="1614" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#8C929B" text-anchor="middle">Статусы 1–7 — те же, что на листе «Заявки» в таблице закупки</text></svg>
