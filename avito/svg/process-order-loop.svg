<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1484" width="1200" height="1484" role="img" aria-label="ZAPKIT — путь заказа"><title>ZAPKIT — путь заказа</title><rect width="1200" height="1484" fill="#FAF7F0"/><g transform="translate(60 50) scale(0.62)"><g transform="translate(0 -30) scale(1.5)"><defs><clipPath id="wb-ol"><path d="M8,60 C8,43 23,34 42,34 C57,34 67,41 71,51 C76,47 79,41 81.5,31 L86.5,31 C88,48 81,60 70,64 C66,76 54,84 38,84 C20,84 8,75 8,60 Z"/></clipPath></defs><path fill="#14161A" d="M8,60 C8,43 23,34 42,34 C57,34 67,41 71,51 C76,47 79,41 81.5,31 L86.5,31 C88,48 81,60 70,64 C66,76 54,84 38,84 C20,84 8,75 8,60 Z"/><path fill="#14161A" d="M84,36 C80,28 73,25 66,26 C70,19 79,19 84,27 C89,19 98,19 102,26 C95,25 88,28 84,36 Z"/><g clip-path="url(#wb-ol)" fill="#FFC72C"><rect x="40" y="30" width="8" height="60"/><rect x="0" y="64" width="90" height="7"/></g><circle cx="22" cy="55" r="3.6" fill="#FFC72C"/><path d="M28,28 V18 M28,22 C24,18 20,18 17,20 M28,22 C32,18 36,18 39,20" fill="none" stroke="#14161A" stroke-width="4.4" stroke-linecap="round"/></g><g transform="translate(176 0)"><defs><clipPath id="c66-ol"><rect width="66" height="100"/></clipPath><clipPath id="c18-ol"><rect width="18" height="100"/></clipPath></defs><g transform="translate(0 0)"><path clip-path="url(#c66-ol)" d="M0,9 H57 L9,91 H66" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g><g transform="translate(80 0)"><path clip-path="url(#c66-ol)" d="M9,100 V36 L28,9 H38 L57,36 V100 M9,62 H57" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g><g transform="translate(160 0)"><path clip-path="url(#c66-ol)" d="M9,100 V9 H44 A13,13 0 0 1 57,22 V45 A13,13 0 0 1 44,58 H9" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g><g transform="translate(240 0)"><path clip-path="url(#c66-ol)" d="M9,0 V100 M9,64 L62,-6 M30,44 L66,106" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g><g transform="translate(320 0)"><path clip-path="url(#c18-ol)" d="M9,0 V100" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g><g transform="translate(352 0)"><path clip-path="url(#c66-ol)" d="M0,9 H66 M33,9 V100" fill="none" stroke="#14161A" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10"/></g></g></g><text x="60" y="190" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#14161A" text-anchor="start">ПУТЬ ЗАКАЗА</text><text x="60" y="234" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#8C929B" text-anchor="start">от «В обработке» до отзыва и следующего ТО</text><rect x="60" y="262" width="1080" height="64" rx="18" fill="none" stroke="#FFC72C" stroke-width="4"/><text x="84" y="303" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Начало — шаг 7: оплачено, детали заказаны у поставщика до отсечки</text><line x1="124" y1="425.0" x2="124" y2="1113.0" stroke="#C9CDD3" stroke-width="6"/><rect x="60" y="350" width="1080" height="150" rx="24" fill="#FFFFFF"/><circle cx="124" cy="425.0" r="34" fill="#FFC72C"/><text x="124" y="437.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="middle">8</text><rect x="882.0" y="372" width="234.0" height="42" rx="21" fill="#14161A"/><text x="999.0" y="400" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFC72C" text-anchor="middle">в день поставки</text><text x="190" y="406" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="start">Детали у нас</text><text x="190" y="446" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Забираем у поставщика, сверяем артикулы, количество и целость</text><text x="190" y="480" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8C929B" text-anchor="start">Не то или брак → меняем у поставщика сразу, клиенту — честно о сроке</text><rect x="60" y="522" width="1080" height="150" rx="24" fill="#FFFFFF"/><circle cx="124" cy="597.0" r="34" fill="#FFC72C"/><text x="124" y="609.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="middle">9</text><rect x="908.4" y="544" width="207.6" height="42" rx="21" fill="#14161A"/><text x="1012.2" y="572" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFC72C" text-anchor="middle">в тот же день</text><text x="190" y="578" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="start">Собран</text><text x="190" y="618" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Тяжёлое вниз, канистру в пакет, карта ремонта с VIN сверху</text><text x="190" y="652" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8C929B" text-anchor="start">Фото открытой коробки — клиенту в чат до отправки</text><rect x="60" y="694" width="1080" height="150" rx="24" fill="#FFFFFF"/><circle cx="124" cy="769.0" r="34" fill="#FFC72C"/><text x="124" y="781.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#14161A" text-anchor="middle">10</text><rect x="974.4" y="716" width="141.6" height="42" rx="21" fill="#14161A"/><text x="1045.2" y="744" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFC72C" text-anchor="middle">до 20:00</text><text x="190" y="750" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="start">Отправлен</text><text x="190" y="790" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Сдаём в СДЭК, трек-номер клиенту в течение часа</text><text x="190" y="824" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8C929B" text-anchor="start">Самовывоз: встреча в Сочи с 9:00 до 20:00</text><rect x="60" y="866" width="1080" height="150" rx="24" fill="#FFFFFF"/><circle cx="124" cy="941.0" r="34" fill="#FFC72C"/><text x="124" y="953.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#14161A" text-anchor="middle">11</text><rect x="868.8" y="888" width="247.2" height="42" rx="21" fill="#14161A"/><text x="992.4" y="916" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFC72C" text-anchor="middle">следим за треком</text><text x="190" y="922" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#14161A" text-anchor="start">Получен</text><text x="190" y="962" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Пишем, когда посылка в пункте, напоминаем про срок хранения</text><text x="190" y="996" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8C929B" text-anchor="start">Спрашиваем пробег в месяц — для напоминания о ТО</text><rect x="60" y="1038" width="1080" height="150" rx="24" fill="#14161A"/><circle cx="124" cy="1113.0" r="34" fill="#FFC72C"/><text x="124" y="1125.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#14161A" text-anchor="middle">12</text><rect x="855.6" y="1060" width="260.4" height="42" rx="21" fill="#FFC72C"/><text x="985.8" y="1088" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#14161A" text-anchor="middle">на следующий день</text><text x="190" y="1094" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FAF7F0" text-anchor="start">Закрыт</text><text x="190" y="1134" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#FAF7F0" text-anchor="start">Спасибо и одна просьба об отзыве</text><text x="190" y="1168" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#C9CDD3" text-anchor="start">Отвечаем на каждый отзыв, даже плохой</text><rect x="60" y="1210" width="1080" height="64" rx="18" fill="none" stroke="#8C929B" stroke-width="4"/><text x="84" y="1251" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#14161A" text-anchor="start">Проблема: не хватило, не подошло, брак → довезём, заменим или вернём деньги</text><rect x="60" y="1292" width="1080" height="64" rx="18" fill="none" stroke="#FFC72C" stroke-width="4"/><text x="84" y="1333" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#14161A" text-anchor="start">За 2 недели до следующего ТО → напоминаем → снова шаг 1, уже как постоянный клиент</text><text x="600.0" y="1434" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#8C929B" text-anchor="middle">Статусы 8–12 и «Проблема» — те же, что на листе «Заявки»</text></svg>
