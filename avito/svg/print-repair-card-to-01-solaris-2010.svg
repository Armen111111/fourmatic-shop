e="#14161A" stroke-width="4" stroke-dasharray="14 10"/><text x="205" y="1568" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#8C929B" text-anchor="middle">QR</text><text x="370" y="1480" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#14161A" text-anchor="start">Видео: как сделать эту работу</text><text x="370" y="1550" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#14161A" text-anchor="start">Всё на месте? Оставьте отзыв на Авито —</text><text x="370" y="1586" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#14161A" text-anchor="start">это очень помогает.</text><text x="370" y="1640" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#14161A" text-anchor="start">Чего-то не хватает? Напишите нам в чат</text><text x="370" y="1676" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#14161A" text-anchor="start">Авито — довезём бесплатно.</text></svg>
